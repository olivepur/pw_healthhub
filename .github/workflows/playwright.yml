name: Playwright Tests
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  healthhub:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Environment-Secrets (HEALTHHUB_EMAIL, HEALTHHUB_PASSWORD) gibt es nur mit dieser Bindung
    environment: qa
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run HealthHub tests
      run: npm run test:healthhub
      env:
        HEALTHHUB_EMAIL: ${{ secrets.HEALTHHUB_EMAIL }}
        HEALTHHUB_PASSWORD: ${{ secrets.HEALTHHUB_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: healthhub-report
        path: healthhub/playwright-report/
        retention-days: 30
